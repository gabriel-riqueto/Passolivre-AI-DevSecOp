name: PassoLivre AI - DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  security-build:
    name: Testes e Seguranca
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pytest semgrep

      - name: Executar testes
        run: python -m pytest -q

      - name: Gitleaks - Detectar segredos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep - Analise estatica
        run: semgrep scan --config p/python --config .semgrep.yml --error

      - name: Construir imagem Docker
        run: docker build --pull -t passolivre:ci .

      - name: Trivy - Relatorio completo
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: passolivre:ci
          scan-type: image
          format: table
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: false
          output: trivy-completo.txt

      - name: Salvar relatorio de vulnerabilidades
        uses: actions/upload-artifact@v4
        with:
          name: trivy-relatorio-completo
          path: trivy-completo.txt

      - name: Trivy - Bloquear vulnerabilidades corrigiveis
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: passolivre:ci
          scan-type: image
          format: table
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Definir nome da imagem
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: echo "IMAGE=ghcr.io/gabriel-riqueto/passolivre-ai:latest" >> "$GITHUB_ENV"

      - name: Autenticar no GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagem Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker tag passolivre:ci "$IMAGE" && docker tag passolivre:ci "${IMAGE%:*}:${GITHUB_SHA}" && docker push "$IMAGE" && docker push "${IMAGE%:*}:${GITHUB_SHA}"

  deploy:
    name: Deploy Automatico Azure
    needs: security-build
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Login Azure OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preparar Azure Container Apps
        run: az extension add --name containerapp --upgrade --yes

      - name: Atualizar PassoLivre AI
        run: az containerapp update --name ca-passolivre-ai --resource-group rg-passolivre-devops --container-name api --image "ghcr.io/gabriel-riqueto/passolivre-ai:${GITHUB_SHA}" --output none

      - name: Verificar imagem publicada
        run: az containerapp show --name ca-passolivre-ai --resource-group rg-passolivre-devops --query "properties.template.containers[?name=='api'].image" --output tsv        